services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env.development.local
    volumes:
      - .:/app
      # Anonymous volumes so the container's own installs aren't shadowed
      # by bind-mounting the host's (possibly Windows/different-arch) copies.
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Local-only stand-in for the Neon Postgres used in production. Port is
  # published to the host for convenience (e.g. connecting a DB GUI); the
  # app and migrations reach it via the compose network by service name.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
